services:
  dashboard:
    image: "${IMAGE:?IMAGE is required}:${VERSION:?VERSION is required}"
    container_name: pbjt-dashboard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${PBJT_DASHBOARD_PORT:-8091}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

